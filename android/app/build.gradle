apply plugin: 'com.android.application'

def sampleApp = 'ca-app-pub-3940256099942544~3347511713'
def sampleBanner = 'ca-app-pub-3940256099942544/9214589741'
def validation = project.findProperty('validationBuild') == 'true'
def env = { name -> System.getenv(name) ?: '' }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def quote = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def signingReady = ['ANDROID_KEYSTORE_PATH','ANDROID_STORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD'].every { env(it) }
if (releaseRequested && !validation) {
    if (!signingReady) throw new GradleException('Release requires an owner-managed upload key. Use -PvalidationBuild=true only for an UNSIGNED non-publishable validation bundle.')
    if (!(env('ADMOB_APP_ID') ==~ /ca-app-pub-\d{16}~\d{10}/) || env('ADMOB_APP_ID').contains('3940256099942544')) throw new GradleException('Real ADMOB_APP_ID required for release')
    if (!(env('ADMOB_BANNER_ID') ==~ /ca-app-pub-\d{16}\/\d{10}/) || env('ADMOB_BANNER_ID').contains('3940256099942544')) throw new GradleException('Real ADMOB_BANNER_ID required for release')
    if (!env('PRIVACY_POLICY_URL').startsWith('https://') || !env('SUPPORT_EMAIL').contains('@')) throw new GradleException('Public privacy URL and support contact required')
}
android {
    namespace = 'com.gokhanagingil.kuskoyusudoku'
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.gokhanagingil.kuskoyusudoku'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [admobAppId: sampleApp]
        aaptOptions { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
    }
    signingConfigs {
        if (signingReady && !validation) {
            upload {
                storeFile file(env('ANDROID_KEYSTORE_PATH'))
                storePassword env('ANDROID_STORE_PASSWORD')
                keyAlias env('ANDROID_KEY_ALIAS')
                keyPassword env('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            buildConfigField 'String', 'ADMOB_BANNER_ID', quote(sampleBanner)
        }
        release {
            debuggable false
            minifyEnabled false
            manifestPlaceholders = [admobAppId: validation ? sampleApp : env('ADMOB_APP_ID')]
            buildConfigField 'String', 'ADMOB_BANNER_ID', quote(validation ? sampleBanner : env('ADMOB_BANNER_ID'))
            if (signingReady && !validation) signingConfig signingConfigs.upload
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
apply from: 'capacitor.build.gradle'
